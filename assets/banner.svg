<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="HR Attrition Intelligence, Power BI dashboard">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#CBD5F0"/>
    </pattern>
    <clipPath id="typed">
      <rect x="50" y="150" width="0" height="40">
        <animate attributeName="width" from="0" to="640" dur="2.2s" begin="0.8s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .f { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: .9; } 50% { opacity: .25; } }
    .rise { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
    .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .9s cubic-bezier(.2,.8,.2,1) both; }
    .val { animation: fade .5s ease both; }
    .dot { animation: pulse 1.6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- background -->
  <rect width="1000" height="300" rx="22" fill="#F3F4FA"/>
  <rect width="1000" height="300" rx="22" fill="url(#dots)"/>
  <rect x="0.75" y="0.75" width="998.5" height="298.5" rx="21" fill="none" stroke="#DDE2F2" stroke-width="1.5"/>

  <!-- pill -->
  <g class="rise" style="animation-delay:.1s">
    <rect x="50" y="48" width="280" height="30" rx="15" fill="#2563EB"/>
    <text class="f" x="190" y="68" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="1.5" fill="#FFFFFF">POWER BI  |  PEOPLE ANALYTICS</text>
  </g>

  <!-- title -->
  <text class="f rise" style="animation-delay:.3s" x="50" y="136" font-size="50" fill="#1E293B">HR Attrition Intelligence</text>

  <!-- typed subtitle -->
  <g clip-path="url(#typed)">
    <text class="f" x="50" y="178" font-size="21" fill="#64748B">Who leaves, why they leave, and who is likely to leave next.</text>
  </g>
  <rect y="156" width="2.5" height="26" fill="#2563EB">
    <animate attributeName="x" from="50" to="662" dur="2.2s" begin="0.8s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="3s" repeatCount="indefinite"/>
  </rect>

  <!-- chips -->
  <g class="rise" style="animation-delay:1.4s">
    <rect x="50" y="214" width="150" height="34" rx="17" fill="#FFFFFF" stroke="#DDE2F2"/>
    <circle cx="68" cy="231" r="4" fill="#2563EB"/>
    <text class="f" x="80" y="236" font-size="14" fill="#1E293B">1,470 employees</text>
  </g>
  <g class="rise" style="animation-delay:1.6s">
    <rect x="212" y="214" width="190" height="34" rx="17" fill="#FFFFFF" stroke="#DDE2F2"/>
    <circle cx="230" cy="231" r="4" fill="#2563EB"/>
    <text class="f" x="242" y="236" font-size="14" fill="#1E293B">4 interactive pages</text>
  </g>
  <g class="rise" style="animation-delay:1.8s">
    <rect x="414" y="214" width="180" height="34" rx="17" fill="#FFFFFF" stroke="#DDE2F2"/>
    <circle cx="432" cy="231" r="4" fill="#EF4444" class="dot"/>
    <text class="f" x="444" y="236" font-size="14" fill="#1E293B">237 exits analysed</text>
  </g>

  <!-- mini chart card -->
  <g class="rise" style="animation-delay:.5s">
    <rect x="690" y="36" width="260" height="228" rx="16" fill="#FFFFFF" stroke="#E2E6F3"/>
    <text class="f" x="708" y="64" font-size="13" font-weight="700" fill="#64748B">Attrition by age group</text>
  </g>
  <line x1="706" y1="222" x2="934" y2="222" stroke="#DDE2F2" stroke-width="1.5"/>

  <!-- bars: heights = rate x 3 -->
  <rect class="bar" style="animation-delay:.9s"  x="712" y="104" width="28" height="118" rx="3" fill="#EF4444"/>
  <rect class="bar" style="animation-delay:1.02s" x="750" y="153" width="28" height="69"  rx="3" fill="#2563EB"/>
  <rect class="bar" style="animation-delay:1.14s" x="788" y="167" width="28" height="55"  rx="3" fill="#2563EB"/>
  <rect class="bar" style="animation-delay:1.26s" x="826" y="192" width="28" height="30"  rx="3" fill="#2563EB"/>
  <rect class="bar" style="animation-delay:1.38s" x="864" y="193" width="28" height="29"  rx="3" fill="#2563EB"/>
  <rect class="bar" style="animation-delay:1.5s"  x="902" y="182" width="28" height="40"  rx="3" fill="#2563EB"/>

  <!-- value labels -->
  <g class="f val" style="animation-delay:1.9s" font-size="10" fill="#1E293B" text-anchor="middle">
    <text x="726" y="98">39.2%</text>
    <text x="764" y="147">23.1%</text>
    <text x="802" y="161">18.2%</text>
    <text x="840" y="186">10.1%</text>
    <text x="878" y="187">9.7%</text>
    <text x="916" y="176">13.3%</text>
  </g>

  <!-- x labels -->
  <g class="f" font-size="10" fill="#64748B" text-anchor="middle">
    <text x="726" y="240">18-24</text>
    <text x="764" y="240">25-29</text>
    <text x="802" y="240">30-34</text>
    <text x="840" y="240">35-39</text>
    <text x="878" y="240">40-49</text>
    <text x="916" y="240">50+</text>
  </g>
</svg>
